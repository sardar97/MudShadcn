name: Publish to NuGet

# Publishes the NuGet package, and creates a matching GitHub Release, whenever a version tag
# (v1.2.3, v1.1.0-beta.1, …) is pushed. The tag is the single source of truth for the version.
#
# It can also be run by hand (Actions → Publish to NuGet → Run workflow) with a version, for when
# pushing a tag is not possible: it then releases the commit it runs on, and the GitHub Release step
# creates the v<version> tag there. The version must equal <Version> in MudShadcn.csproj.
#
# This is the ONLY thing that publishes the package. The showcase deploys separately (push to the
# `docs` branch → Cloudflare Pages); see RELEASE.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (e.g. 1.2.0). Must equal <Version> in MudShadcn.csproj.
        required: true
        type: string

# contents: write lets the workflow create the GitHub Release. id-token: write lets it ask GitHub
# for the OIDC token that nuget.org's Trusted Publishing exchanges for a one-hour API key, so no
# NuGet API key is stored anywhere (RELEASE.md, "Set up Trusted Publishing on nuget.org").
permissions:
  contents: write
  id-token: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # refs/tags/v1.0.0-beta.1 -> 1.0.0-beta.1; a manual run takes the version it was given.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            PROJECT_VERSION="$(sed -nE 's#.*<Version>([^<]+)</Version>.*#\1#p' src/MudShadcn/MudShadcn.csproj)"
            if [ "$VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::Version $VERSION does not match <Version>$PROJECT_VERSION</Version> in MudShadcn.csproj."
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Quality gate: the same build and check as CI, so a red tag never reaches nuget.org.
      - name: Build
        run: dotnet build MudShadcn.sln -c Release -warnaserror -p:Version=${{ steps.version.outputs.version }}

      - name: Check the stylesheet against MudBlazor
        run: tools/verify-mudblazor.sh

      # Produces MudShadcn.<version>.nupkg and the matching .snupkg (symbols).
      - name: Pack
        run: dotnet pack src/MudShadcn -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      # The package about to be published, referenced the way a consumer references it: a copy of
      # the test app restored against it has to start, render and serve both stylesheets.
      - name: Test the package as a consumer gets it
        run: tools/test-package.sh artifacts

      # Trusted Publishing: trades GitHub's OIDC token for a NuGet API key that is valid for an hour,
      # so it is requested right before the push. `user` is the nuget.org profile name that owns the
      # policy, not an email address.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: SardarQaslany

      # Pushes the .nupkg and, next to it, the .snupkg. --skip-duplicate makes a re-run safe.
      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The notes for this version from CHANGELOG.md: the "## [1.2.3] — …" section, up to the next
      # version heading or the link references at the bottom of the file.
      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release v$VERSION. See CHANGELOG.md for details." > release-notes.md
          fi
          printf '\nNuGet: https://www.nuget.org/packages/MudShadcn/%s\n' "$VERSION" >> release-notes.md

      # Creates the GitHub Release for the tag (or updates it on a re-run), with the package
      # attached. A version with a hyphen (1.1.0-beta.1) is marked as a pre-release. On a manual run
      # the tag does not exist yet, and --target creates it on the commit that was released.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md $PRERELEASE
          fi
